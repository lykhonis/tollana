name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t format,lint,check,test --projects=tollana-core,tollana-host --parallel=1

  www:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm nx run-many -t lint,typecheck,test,build --projects=www

  deploy:
    needs: [rust, www]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set repository secret CLOUDFLARE_API_TOKEN (Cloudflare dashboard → API tokens → Edit Cloudflare Workers)."
            exit 1
          fi
      - name: Detect if www is affected
        id: affected
        run: |
          set -euo pipefail
          EMPTY=0000000000000000000000000000000000000000
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.sha }}'

          if [ "$BEFORE" = "$EMPTY" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base SHA; deploying www"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm exec nx show projects --affected --type=app --base="$BEFORE" --head="$HEAD" --json > affected.json
          echo "Affected apps:"
          cat affected.json
          python3 -c '
          import json, sys
          raw = open("affected.json").read()
          start, end = raw.find("["), raw.rfind("]")
          projects = json.loads(raw[start : end + 1] if start != -1 else "[]")
          print("deploy=true" if "www" in projects else "deploy=false")
          ' >> "$GITHUB_OUTPUT"
      - name: Deploy www
        if: steps.affected.outputs.deploy == 'true'
        run: pnpm nx deploy www
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Purge tollana.ai cache
        if: steps.affected.outputs.deploy == 'true' && vars.CLOUDFLARE_ZONE_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["tollana.ai"]}'
